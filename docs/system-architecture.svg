  <path class="edge-red" d="M1655 485 V625"/><text class="edge-label" x="1655" y="570" text-anchor="middle">high-voltage plasma</text>
  <path class="edge-green" d="M1020 670 H1080"/><text class="edge-label" x="1050" y="660" text-anchor="middle">RS485</text>
  <path class="edge-green" d="M1300 670 H1560"/><text class="edge-label" x="1410" y="660">gas flow</text>
  <path class="edge-blue" d="M800 220 H770 V755 H630 V830"/><text class="edge-label" x="783" y="660" transform="rotate(-90 783 660)">samples + monitoring events</text>
