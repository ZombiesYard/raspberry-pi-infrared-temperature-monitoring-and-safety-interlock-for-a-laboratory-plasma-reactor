  <path class="edge-green" d="M630 470 V670 H800"/><text class="edge-label" x="640" y="610">flow setpoint</text>
  <path class="edge-red" d="M1300 395 H1320 V340 H1340"/><text class="edge-label" x="1332" y="328" text-anchor="end">USB serial</text>
  <path class="edge-red" d="M1300 445 H1320 V495 H1340"/><text class="edge-label" x="1302" y="486">CAN</text>
  <path class="edge-red" d="M1530 340 H1655 V385"/><text class="edge-label" x="1590" y="329">NC interlocks</text>
