  <path class="edge-blue" d="M740 875 H800"/><text class="edge-label" x="745" y="865">async write / package</text>
  <path class="edge-blue" d="M1020 875 H1080"/><text class="edge-label" x="1034" y="865">outbox upload</text>

  <rect class="node" x="40" y="160" width="190" height="80" rx="11" fill="#d5e8d4" stroke="#82b366"/><text class="node-title" x="135" y="193" text-anchor="middle">HIKMICRO E20Plus</text><text class="node-sub" x="135" y="217" text-anchor="middle">Infrared camera</text>
  <rect class="node" x="270" y="160" width="190" height="80" rx="11" fill="#d5e8d4" stroke="#82b366"/><text class="node-title" x="365" y="193" text-anchor="middle">HikmicroAnalyzer</text><text class="node-sub" x="365" y="217" text-anchor="middle">Max temperature overlay</text>
  <rect class="node" x="520" y="160" width="220" height="80" rx="11" fill="#f5f5f5" stroke="#666"/><text class="node-title" x="630" y="192" text-anchor="middle">ROI capture + Tesseract</text><text class="node-sub" x="630" y="216" text-anchor="middle">Infrastructure · ITemperatureReader</text>
  <rect class="node" x="800" y="150" width="220" height="100" rx="11" fill="#e1d5e7" stroke="#9673a6"/><text class="node-title" x="910" y="190" text-anchor="middle">MonitoringService</text><text class="node-sub" x="910" y="216" text-anchor="middle">Application · poll and invoke ports</text>
  <rect class="node" x="1080" y="150" width="220" height="100" rx="11" fill="#fff2cc" stroke="#d6b656"/><text class="node-title" x="1190" y="190" text-anchor="middle">InterlockStateMachine</text><text class="node-sub" x="1190" y="216" text-anchor="middle">Domain · threshold, latch, decision</text>
  <rect class="node" x="520" y="380" width="220" height="90" rx="11" fill="#dae8fc" stroke="#6c8ebf"/><text class="node-title" x="630" y="416" text-anchor="middle">MainWindow + settings</text><text class="node-sub" x="630" y="442" text-anchor="middle">WPF · operator and device controls</text>
  <rect class="node" x="800" y="375" width="220" height="90" rx="11" fill="#e1d5e7" stroke="#9673a6"/><text class="node-title" x="910" y="412" text-anchor="middle">IRelayController</text><text class="node-sub" x="910" y="438" text-anchor="middle">Application port · selected mode</text>
  <rect class="node safety" x="1080" y="370" width="220" height="100" rx="11" fill="#f8cecc" stroke="#b85450"/><text class="node-title" x="1190" y="407" text-anchor="middle">Hybrid G2000 interlock</text><text class="node-sub" x="1190" y="433" text-anchor="middle">Infrastructure · software trip</text><text class="node-sub" x="1190" y="452" text-anchor="middle">CAN recovery · physical relay</text>
  <rect class="node safety" x="1340" y="300" width="190" height="80" rx="11" fill="#f8cecc" stroke="#b85450"/><text class="node-title" x="1435" y="333" text-anchor="middle">DSD TECH SH-UR04A</text><text class="node-sub" x="1435" y="357" text-anchor="middle">4-channel USB relay</text>
  <rect class="node" x="1340" y="455" width="190" height="80" rx="11" fill="#ffe6cc" stroke="#d79b00"/><text class="node-title" x="1435" y="488" text-anchor="middle">PCAN-USB</text><text class="node-sub" x="1435" y="512" text-anchor="middle">CAN adapter</text>
  <rect class="node safety" x="1560" y="385" width="190" height="100" rx="11" fill="#f8cecc" stroke="#b85450"/><text class="node-title" x="1655" y="420" text-anchor="middle">G2000 plasma generator</text><text class="node-sub" x="1655" y="446" text-anchor="middle">CAN + normally closed</text><text class="node-sub" x="1655" y="465" text-anchor="middle">physical interlocks</text>
  <rect class="node" x="1560" y="625" width="190" height="90" rx="11" fill="#fff2cc" stroke="#d6b656"/><text class="node-title" x="1655" y="662" text-anchor="middle">Plasma reactor</text><text class="node-sub" x="1655" y="688" text-anchor="middle">Monitored process</text>
  <rect class="node" x="800" y="625" width="220" height="90" rx="11" fill="#f5f5f5" stroke="#666"/><text class="node-title" x="910" y="662" text-anchor="middle">AMC2100 controller</text><text class="node-sub" x="910" y="688" text-anchor="middle">Infrastructure · serialized Modbus</text>
  <rect class="node" x="1080" y="625" width="220" height="90" rx="11" fill="#d5e8d4" stroke="#82b366"/><text class="node-title" x="1190" y="662" text-anchor="middle">AMC2100</text><text class="node-sub" x="1190" y="688" text-anchor="middle">Gas mass-flow controller</text>
  <rect class="node" x="520" y="830" width="220" height="90" rx="11" fill="#dae8fc" stroke="#6c8ebf"/><text class="node-title" x="630" y="867" text-anchor="middle">Evidence coordinator</text><text class="node-sub" x="630" y="893" text-anchor="middle">Infrastructure · bounded sidecar</text>
  <rect class="node" x="800" y="830" width="220" height="90" rx="24" fill="#dae8fc" stroke="#6c8ebf"/><text class="node-title" x="910" y="867" text-anchor="middle">Local run + outbox</text><text class="node-sub" x="910" y="893" text-anchor="middle">CSV · JSON · short ZIP</text>
  <rect class="node" x="1080" y="830" width="220" height="90" rx="11" fill="#dae8fc" stroke="#6c8ebf"/><text class="node-title" x="1190" y="867" text-anchor="middle">GitLab Package Registry</text><text class="node-sub" x="1190" y="893" text-anchor="middle">Background upload + retry</text>

  <text class="note" x="1540" y="782" text-anchor="middle" fill="#9f1239"><tspan x="1540" dy="0">Temperature Stop latches software state and opens the physical NC interlock;</tspan><tspan x="1540" dy="20">it does not explicitly send CAN HV Aus.</tspan></text>
  <text class="note" x="900" y="1010" text-anchor="middle" fill="#475569">Blue dashed evidence paths are bounded sidecars and never participate in the interlock decision or Stop/Reset path.</text>
</svg>