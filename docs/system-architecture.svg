<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title description">
  <title id="title">Laboratory plasma reactor monitoring and safety interlock architecture</title>
  <desc id="description">The reactor is measured by a HIKMICRO camera. HikmicroAnalyzer, ROI capture, Tesseract, MonitoringService, and InterlockStateMachine form the temperature decision path. MonitoringService invokes a selected relay port. In G2000 CAN mode the hybrid adapter controls a physical normally closed interlock and bidirectional CAN. AMC2100 is independent. Experiment evidence is recorded and uploaded on a non-safety sidecar path.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b85450"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#628a4c"/></marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b48a13"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4f81bd"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.zone-title{font-size:18px;font-weight:700}.node-title{font-size:16px;font-weight:700}.node-sub{font-size:13px;fill:#475569}.legend{font-size:13px;fill:#475569}.edge-label{font-size:12px;fill:#475569;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.note{font-size:13px;font-style:italic}.zone{stroke-width:1.6}.node{stroke-width:1.6}.safety{stroke-width:2.2}.edge{fill:none;stroke:#64748b;stroke-width:1.9;marker-end:url(#arrow-gray)}.edge-domain{fill:none;stroke:#b48a13;stroke-width:2.1;marker-end:url(#arrow-yellow)}.edge-red{fill:none;stroke:#b85450;stroke-width:2.5;marker-end:url(#arrow-red)}.edge-red-bidir{fill:none;stroke:#d79b00;stroke-width:2.5;marker-start:url(#arrow-red);marker-end:url(#arrow-red)}.edge-green{fill:none;stroke:#628a4c;stroke-width:2;marker-end:url(#arrow-green)}.edge-green-dashed{fill:none;stroke:#628a4c;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow-green)}.edge-blue{fill:none;stroke:#4f81bd;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow-blue)}
    </style>
  </defs>
  <rect width="1800" height="1050" fill="#fff"/>
  <text class="title" x="900" y="44" text-anchor="middle">Laboratory Plasma Reactor Temperature Monitoring and Safety Interlock</text>
  <text class="legend" x="900" y="82" text-anchor="middle"><tspan font-weight="700">Layer tags:</tspan> WPF (blue) · Application (purple) · Domain (yellow) · Infrastructure (gray) · physical safety path (red/orange) · evidence only (blue dashed)</text>

  <rect class="zone" x="480" y="105" width="820" height="650" rx="14" fill="#f8fafc" stroke="#64748b"/>
  <text class="zone-title" x="890" y="134" text-anchor="middle">Windows application (.NET 8 WPF)</text>
  <rect class="zone" x="1310" y="250" width="460" height="500" rx="14" fill="#fff4e6" stroke="#d79b00"/>
  <text class="zone-title" x="1540" y="280" text-anchor="middle">Laboratory devices and physical safety path</text>
  <rect class="zone" x="480" y="780" width="820" height="180" rx="14" fill="#e8f4f8" stroke="#4f81bd"/>
  <text class="zone-title" x="890" y="811" text-anchor="middle">Non-safety evidence path</text>

  <path class="edge-green-dashed" d="M1750 670 H1780 V115 H135 V160"/><text class="edge-label" x="1450" y="109">infrared measurement</text>
  <path class="edge-green" d="M230 200 H270"/><text class="edge-label" x="250" y="190" text-anchor="middle">image</text>
  <path class="edge-green" d="M460 200 H520"/><text class="edge-label" x="490" y="190" text-anchor="middle">ROI</text>
